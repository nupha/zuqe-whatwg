[package]
name = "zuqe-whatwg"
version = "0.1.0"
edition = "2024"
description = "WHATWG standard Web API implementations for the zuqe JavaScript engine"
license = "Apache-2.0"
keywords = ["whatwg", "web-api", "fetch", "streams", "url"]
categories = ["web-programming", "api-bindings"]

[features]
# WHATWG fetch: browser semantics (CORS + shared cookie jar)
fetch_cors_cookie = ["dep:cookie_store", "dep:chrono"]
# WHATWG fetch: HTTP cache + `caches` / `CacheStorage` globals
fetch_cache = []

[[example]]
name = "wpt_runtime"
required-features = ["fetch_cors_cookie", "fetch_cache"]

[dependencies]
zuqe = { version = "0.12.1", features = [
    "gc_generations",
    "crossbeam_channel",
    "serde_json_support",
] }
crossbeam = "0.8"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "net",
    "time",
    "fs",
    "io-std",
    "process",
] }
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "stream",
    "gzip",
    "brotli",
    "deflate",
    "zstd",
    "http2",
    "rustls",
    "cookies",
] }
# direct dep for `hyper::ext::ReasonPhrase` (reqwest doesn't re-export it)
hyper = { version = "1", default-features = false, features = ["http1"] }
log = "0.4"
futures-util = "0.3"
uuid = { version = "1", default-features = false, features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = [
    "std",
], optional = true }
url = "2"
cookie_store = { version = "0.22", optional = true }
base64 = "0.22"
sha2 = "0.11"
sha1 = "0.11"
hmac = "0.13"
aes-gcm = "0.11"
rand = "0.9"
subtle = "2"

[dev-dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
